version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: pufa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pufa_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pufa_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      NODE_ENV: development
      APP_PORT: ${APP_PORT:-3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - db
    volumes:
      - uploads_data:/usr/src/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db_data:
  uploads_data:
